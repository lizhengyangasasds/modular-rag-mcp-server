name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Lint — fastest feedback, no dependency install needed
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install "ruff>=0.1.0"

      - name: Run ruff
        run: ruff check src/ tests/

  # ---------------------------------------------------------------------------
  # Job 2: Type check — mypy (moderate speed)
  # ---------------------------------------------------------------------------
  type-check:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e .

      - name: Run mypy
        run: mypy src/ --no-error-summary

  # ---------------------------------------------------------------------------
  # Job 3: Unit tests — Python 3.9 → 3.13 matrix
  # ---------------------------------------------------------------------------
  test-unit:
    name: Unit tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          # mcp package is required by some test files but may not be in the
          # base install on all environments. Install explicitly to avoid
          # ModuleNotFoundError during test collection.
          pip install modelcontextprotocol 2>/dev/null || true

      - name: Run unit tests (no llm-api, no slow tests)
        run: |
          mkdir -p test-results
          pytest tests/unit/
          -m "not llm"
          -m "not slow"
          --ignore=tests/unit/test_smoke_imports.py
          -v
          --tb=short
          --cov=src
          --cov-report=xml
          --cov-report=term-missing
          --junitxml=test-results/pytest.xml

      - name: Upload coverage to Codecov
        if: ${{ matrix.python-version == '3.11' }}
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-py${{ matrix.python-version }}
          path: test-results/

  # ---------------------------------------------------------------------------
  # Job 4: Integration tests — single Python version, requires external services
  # ---------------------------------------------------------------------------
  test-integration:
    name: Integration tests
    runs-on: ubuntu-latest
    # Only run on Python 3.11 to save CI time; integration tests are slow.
    # ChromaDB and Redis are launched via docker compose.
    services:
      chromadb:
        image: chromadb/chroma:0.4.22
        ports:
          - 8000:8000
        options: >-
          --health-cmd "curl -f http://localhost:8000/api/v1/heartbeat"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install modelcontextprotocol 2>/dev/null || true

      - name: Run integration tests
        run: |
          mkdir -p test-results
          pytest tests/integration/
          -m "not llm"
          -v
          --tb=short
          --junitxml=test-results/pytest.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-integration
          path: test-results/

  # ---------------------------------------------------------------------------
  # Job 5: End-to-end smoke tests
  # ---------------------------------------------------------------------------
  test-e2e:
    name: E2E smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install modelcontextprotocol 2>/dev/null || true

      - name: Run e2e tests
        run: |
          mkdir -p test-results
          pytest tests/e2e/
          -m "not llm"
          -v
          --tb=short
          --junitxml=test-results/pytest.xml
